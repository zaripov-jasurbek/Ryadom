<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8ece8" data-default="#e8ece8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#24282b" data-default="#24282b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Рядом — разделите счёт легко</title>
    <script>
      // Apply a saved light/dark choice before first paint; no saved choice means follow the system.
      try { const theme = localStorage.getItem('billsplit:theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
