name: Release

# Каждый мерж в master обновляет PR «release x.y.z» (версия в package.json и CHANGELOG.md считаются по коммитам
# feat:/fix:). Мерж этого PR создаёт тег vX.Y.Z с GitHub Release, и этот же запуск публикует тег на GitHub Pages:
# тег, созданный через GITHUB_TOKEN, не запускает другие workflow, поэтому деплой вызывается отсюда.
on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
